<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AI 自主建站测试</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
         background:linear-gradient(160deg,#0f172a,#1e293b 60%,#334155); color:#e2e8f0;
         min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card { width:100%; max-width:420px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12);
          border-radius:20px; padding:32px 24px; text-align:center; backdrop-filter:blur(8px); }
  h1 { font-size:22px; margin-bottom:10px; }
  p { font-size:14px; color:#94a3b8; line-height:1.7; margin-bottom:20px; }
  .btn { display:inline-block; min-height:44px; line-height:44px; padding:0 28px; border-radius:22px;
         background:linear-gradient(90deg,#6366f1,#8b5cf6); color:#fff; font-size:15px; border:none; }
</style>
</head>
<body>
  <div class="card">
    <h1>🚀 自主建站技能上线</h1>
    <p>这个页面由 AI 自己创建 GitHub 仓库、编写代码、自检并通过 Render API 发布，全程无人工干预。</p>
    <button class="btn" onclick="this.textContent='✅ 手机上也很好点'">点我试试</button>
  </div>
</body>
</html>
